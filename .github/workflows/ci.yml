name: BhashaSetu AI — Continuous Integration (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # --- 1. Python AI Platform Testing & Linting ---
  ai-platform-test:
    name: AI Platform & Synthesis Pipeline (Python 3.12)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pydantic httpx
        if [ -f services/ai-platform/requirements.txt ]; then pip install -r services/ai-platform/requirements.txt; fi

    - name: Run Master 12-Tier End-to-End Test Suite
      run: |
        python tests/verify_all.py

    - name: Run 15-Query Hybrid RAG Benchmark Suite
      run: |
        python tests/benchmark_rag.py

    - name: Run Infrastructure & Kubernetes Validation Tests
      run: |
        python tests/test_infra.py

  # --- 2. Web Backend & Gateway Testing ---
  web-backend-test:
    name: Web Backend & Gateway Core (Node.js 22 LTS)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'services/web-backend/package.json'

    - name: Install Dependencies
      working-directory: ./services/web-backend
      run: |
        npm install

    - name: Build Web Backend
      working-directory: ./services/web-backend
      run: |
        npm run build

  # --- 3. Web Frontend Build Verification ---
  web-frontend-test:
    name: Web Frontend (Next.js 16.3 + React 19.2)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'apps/web-frontend/package.json'

    - name: Install Dependencies
      working-directory: ./apps/web-frontend
      run: |
        npm install

    - name: Build Next.js Application
      working-directory: ./apps/web-frontend
      run: |
        npm run build

  # --- 4. Docker Multi-Stage Build & Security Lint ---
  docker-build:
    name: Production Docker Multi-Stage Build Verification
    runs-on: ubuntu-latest
    needs: [ai-platform-test, web-backend-test, web-frontend-test]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: actions/setup-buildx-action@v3

    - name: Build AI Platform Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./services/ai-platform
        file: ./services/ai-platform/Dockerfile
        push: false
        tags: bhashasetu/ai-platform:test

    - name: Build Web Backend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./services/web-backend
        file: ./services/web-backend/Dockerfile
        push: false
        tags: bhashasetu/web-backend:test

    - name: Build Web Frontend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./apps/web-frontend
        file: ./apps/web-frontend/Dockerfile
        push: false
        tags: bhashasetu/web-frontend:test
