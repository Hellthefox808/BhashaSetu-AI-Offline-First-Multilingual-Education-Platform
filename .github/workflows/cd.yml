name: BhashaSetu AI — Continuous Deployment (CD) & K8s Validation

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  k8s-validate:
    name: Kubernetes Kustomize & Manifest Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Kustomize
      uses: imranismail/setup-kustomize@v2
      with:
        kustomize-version: "5.3.0"

    - name: Validate Kustomize Build
      run: |
        kustomize build infra/k8s/ > /dev/null
        echo "Kustomize manifest syntax validated successfully!"

    - name: Check Kubernetes Manifests Structure
      run: |
        python -c "import os; assert os.path.exists('infra/k8s/kustomization.yaml'); print('Kubernetes manifests structure verified.')"

  package-release:
    name: Package Signed Offline Distribution Bundles
    runs-on: ubuntu-latest
    needs: [k8s-validate]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build Release Bundle
      run: |
        mkdir -p dist/packages
        echo "Building production release distribution bundles..."
        tar -czf dist/bhashasetu-offline-v3.tar.gz infra/ docs/ packages/
