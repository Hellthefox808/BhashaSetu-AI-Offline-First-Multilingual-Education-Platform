apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bhashasetu-ingress
  namespace: bhashasetu-prod
  labels:
    app.kubernetes.io/name: bhashasetu-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-services: "ai-platform-service,web-backend-service"
spec:
  tls:
  - hosts:
    - bhashasetu.jharkhand.gov.in
    secretName: bhashasetu-tls-cert
  rules:
  - host: bhashasetu.jharkhand.gov.in
    http:
      paths:
      # API Gateway & Backend Routing
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: web-backend-service
            port:
              number: 3001
      # AI Inference Direct Routing
      - path: /ai
        pathType: Prefix
        backend:
          service:
            name: ai-platform-service
            port:
              number: 8000
      # Web Frontend Root Routing
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-frontend-service
            port:
              number: 3000
