apiVersion: v1
kind: Namespace
metadata:
  name: bhashasetu-prod
  labels:
    app.kubernetes.io/name: bhashasetu-ai
    app.kubernetes.io/part-of: bhashasetu-platform
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: bhashasetu-quota
  namespace: bhashasetu-prod
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: bhashasetu-limits
  namespace: bhashasetu-prod
spec:
  limits:
  - default:
      cpu: "1"
      memory: 1Gi
    defaultRequest:
      cpu: "100m"
      memory: 256Mi
    type: Container
