events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream Definitions
    upstream web_frontend {
        server web-frontend:3000;
        keepalive 32;
    }

    upstream web_backend {
        server web-backend:3001;
        keepalive 32;
    }

    upstream ai_platform {
        server ai-platform:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Web Frontend Routing
        location / {
            proxy_pass http://web_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Web Backend REST API Gateway
        location /api/ {
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # AI Platform Direct Gateway & WebSocket Voice Streams
        location /ai/ {
            rewrite ^/ai/(.*) /$1 break;
            proxy_pass http://ai_platform;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }
    }
}
